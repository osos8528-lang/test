name: Workshop PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    name: Rule-based Code Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run shared security scan
        id: review
        continue-on-error: true
        run: python harness/check_harness.py --security-only
      - name: Post Review Comment to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('harness_report.json')) return;
            const report = JSON.parse(fs.readFileSync('harness_report.json', 'utf8'));
            const findings = report.failures.map(x => '- [' + x.rule + '] ' + x.file + ':' + x.line + ' ' + x.message);
            const body = [
              '### Workshop rule-based review',
              report.status + ' — ' + report.total_failures + ' finding(s)',
              'Limited source checks; no external AI model or production security certification.',
              ...findings
            ].join('\n\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
      - name: Fail the job when security scan fails
        if: steps.review.outcome == 'failure'
        run: exit 1

  verify:
    name: Tests and Harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install workshop dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests with coverage threshold
        run: python -m pytest tests -q --tb=short --cov=main --cov-report=term-missing --cov-fail-under=85
      - name: Run workshop harness
        run: python harness/check_harness.py
